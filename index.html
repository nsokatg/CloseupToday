<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ＣｌｏｓｅｕｐＴｏｄａｙ</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        header {
            margin-bottom: 24px;
            text-align: center;
        }
        .controls {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .date-picker {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            color: var(--text-main);
            cursor: pointer;
        }
        .category-badge {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 1.75rem;
            margin: 0;
            color: var(--text-main);
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 24px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }
        .section-body {
            line-height: 1.7;
            font-size: 1.05rem;
            white-space: pre-wrap;
        }
        .keywords-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
        }
        .keyword-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chip {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.85rem;
        }
        .chip strong {
            color: var(--primary-color);
        }
        .tags-footer {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
        .tag {
            background: #f8fafc;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 日付選択コントロール -->
        <div class="controls">
            <label for="dateSelect" style="font-size: 0.9rem; font-weight: 600; color: var(--text-sub);">📅 過去ログ選択:</label>
            <input type="date" id="dateSelect" class="date-picker" onchange="onDateChanged()">
        </div>

        <div id="loading" class="loading">学習データを読み込んでいます...</div>
        
        <div id="content" style="display: none;">
            <header>
                <span class="category-badge" id="category-text">カテゴリ</span>
                <h1 id="title-text">テーマ名</h1>
            </header>

            <!-- キーワードセクション -->
            <div class="card">
                <div class="keywords-title">🔑 重要キーワード</div>
                <div class="keyword-chips" id="keywords-container"></div>
            </div>

            <!-- 📌 概要セクション -->
            <div class="card">
                <h2 class="section-title">📌 概要</h2>
                <div id="text-overview" class="section-body"></div>
            </div>

            <!-- 🔍 深掘りセクション -->
            <div class="card">
                <h2 class="section-title">🔍 深掘り</h2>
                <div id="text-deep_dive" class="section-body"></div>
            </div>

            <!-- 🚀 発展セクション -->
            <div class="card">
                <h2 class="section-title">🚀 発展</h2>
                <div id="text-expansion" class="section-body"></div>

                <div class="tags-footer" id="tags-container"></div>
            </div>
        </div>
    </div>

    <script>
        // ★ご指定の新しいGASのWebアプリURLを設定しました
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwCynHxvLuvAcX0sDzC-xhQvD-xk1pCdZVQAwOZZZEmLPPOhSGZGOizlCtAY5xG4GS7/exec";

        // ページ読み込み時に本日の日付をピッカーに設定してデータを取得
        window.addEventListener('DOMContentLoaded', () => {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('dateSelect').value = todayStr;
            fetchKnowledgeData(todayStr);
        });

        // カレンダーの日付が変更されたときの処理
        function onDateChanged() {
            const selectedDate = document.getElementById('dateSelect').value;
            if (selectedDate) {
                fetchKnowledgeData(selectedDate);
            }
        }

        async function fetchKnowledgeData(dateStr) {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('content').style.display = 'none';
                document.getElementById('loading').innerText = `${dateStr} のデータを読み込んでいます...`;

                const url = `${GAS_API_URL}?date=${dateStr}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('loading').innerText = data.error;
                    return;
                }

                // ヘッダー情報
                document.getElementById('category-text').innerText = data.category || "教養";
                document.getElementById('title-text').innerText = data.title || "本日のテーマ";

                // キーワード
                const kwContainer = document.getElementById('keywords-container');
                kwContainer.innerHTML = "";
                if (data.keywords && Array.isArray(data.keywords)) {
                    data.keywords.forEach(kw => {
                        const chip = document.createElement('div');
                        chip.className = 'chip';
                        chip.innerHTML = `<strong>${kw.term}</strong>: ${kw.explanation}`;
                        kwContainer.appendChild(chip);
                    });
                }

                // 3軸テキストの流し込み
                document.getElementById('text-overview').innerText = data.overview || "";
                document.getElementById('text-deep_dive').innerText = data.deep_dive || "";
                document.getElementById('text-expansion').innerText = data.expansion || "";

                // 関連タグ
                const tagContainer = document.getElementById('tags-container');
                tagContainer.innerHTML = "";
                if (data.related_tags && Array.isArray(data.related_tags)) {
                    data.related_tags.forEach(tag => {
                        const t = document.createElement('span');
                        t.className = 'tag';
                        t.innerText = `#${tag}`;
                        tagContainer.appendChild(t);
                    });
                }

                // 表示切り替え
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerText = "データの取得に失敗しました。URLやデプロイ設定をご確認ください。";
            }
        }
    </script>
</body>
</html>
